<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;line-height:1.45;overflow-anchor:none}
body{display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit}
#app{position:relative;width:100%;max-width:520px;min-height:100vh;background:#050505;overflow-x:hidden;box-shadow:0 0 90px rgba(0,0,0,.9)}
.scr{display:none;padding:16px 16px 110px;min-height:100vh}
.scr.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px;background:linear-gradient(#050505 78%,rgba(5,5,5,0))}
.logo{font-size:23px;font-weight:900;letter-spacing:.5px}
.logo small{font-size:11.5px;color:#777;font-weight:700;letter-spacing:1px;margin-left:6px;vertical-align:2px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#151515;border:1px solid #242424;color:#ddd;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:16px;height:16px}
.card{background:#121212;border:1px solid #1e1e1e;border-radius:18px;padding:16px;margin-bottom:12px}
.sec-t{font-size:16.5px;font-weight:800;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t small{font-size:12px;color:#777;font-weight:600}
.muted{color:#999}
.tiny{font-size:12.5px;color:#777;line-height:1.55}
.big{font-weight:900;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#171717;border:1px solid #262626;font-size:13.5px;color:#ccc;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:800}
.chip.sm{padding:4px 9px;font-size:12px;cursor:default}
.ovsum .tiny{font-size:14.5px;color:#9a9a9a}
.ovsum .chip.sm{font-size:18px;padding:10px 15px;color:#fff;border-color:#2e2e2e;font-weight:900;white-space:normal;text-align:center;max-width:100%;line-height:1.3;border-radius:20px;flex-direction:column;gap:1px}
.ovsum .chip.sm small{font-size:13.5px;color:#b0b0b0;font-weight:800;line-height:1.3}
.dhero{position:relative;overflow:hidden}
.dhero>*:not(.heroart){position:relative;z-index:1}
.heroart{position:absolute;z-index:0;right:-22px;top:8px;height:240px;max-width:335px;object-fit:contain;object-position:top right;opacity:.42;transform:rotate(6deg);-webkit-mask-image:linear-gradient(265deg,#000 55%,transparent 96%);mask-image:linear-gradient(265deg,#000 55%,transparent 96%);pointer-events:none}
.dcard{position:relative;overflow:hidden}
.dcard>*:not(.dailyart){position:relative;z-index:1}
.dailyart{position:absolute;z-index:0;right:-22px;top:8px;height:240px;max-width:335px;object-fit:contain;object-position:top right;opacity:.42;transform:rotate(6deg);-webkit-mask-image:linear-gradient(265deg,#000 55%,transparent 96%);mask-image:linear-gradient(265deg,#000 55%,transparent 96%);pointer-events:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 14px}
.pgrid .pcell{background:#fff;border-radius:16px;overflow:hidden}
.pgrid .pcell img{width:100%;height:98px;object-fit:cover;display:block}
.pgrid .pcell .pn{font-size:12.5px;font-weight:900;color:#1c1c1c;text-align:center;padding:6px 5px 8px;line-height:1.3}
.pgrid .pcell .pn small{display:block;font-size:10.5px;color:#666;font-weight:800}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px;margin-bottom:8px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(8,8,8,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #1b1b1b;z-index:60;padding:7px 0 calc(9px + env(safe-area-inset-bottom))}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5c5c5c;font-size:11px;font-weight:800;cursor:pointer;padding:3px 0;letter-spacing:.3px}
.nav-it svg{width:21px;height:21px}
.nav-it.on{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:13px;background:#fff;color:#000;font-weight:800;font-size:14.5px;border:none;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.blk{width:100%}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.pill.h{background:rgba(239,68,68,.16);color:#f87171}
.pill.m{background:rgba(245,158,11,.15);color:#fbbf24}
.pill.l{background:rgba(34,197,94,.14);color:#4ade80}
.pill.g{background:#1c1c1c;color:#999}
.pill.w{background:#fff;color:#000}
.tabbar{position:sticky;top:0;z-index:25;display:flex;gap:6px;overflow-x:auto;background:#050505;padding:12px 0 10px;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:#141414;border:1px solid #232323;font-size:13.5px;font-weight:700;color:#999;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab.on{background:#fff;color:#000;border-color:#fff;font-weight:800}
.tab small{font-size:10.5px;opacity:.6;margin-left:3px;letter-spacing:.5px}
.stat{background:#121212;border:1px solid #1e1e1e;border-radius:14px;padding:12px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:#888;font-weight:700}
.stat .s{font-size:11.5px;margin-top:2px;font-weight:700}
.krw{font-size:11.5px;color:#8f8f8f;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.hbar{height:7px;border-radius:99px;background:#232323;overflow:hidden;flex:1}
.hbar i{display:block;height:100%;border-radius:99px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #171717;cursor:pointer}
.list-row:last-child{border-bottom:none}
.avatar{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;max-width:100%;overflow:hidden;white-space:nowrap}
.backfab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:max(14px, calc(50% - 246px));z-index:56;display:flex;align-items:center;gap:5px;padding:13px 20px;border-radius:999px;background:#fff;color:#000;font-size:15px;font-weight:900;border:none;box-shadow:0 8px 28px rgba(0,0,0,.6);cursor:pointer}
.fabrow{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:max(14px, calc(50% - 246px));right:max(14px, calc(50% - 246px));z-index:56;display:flex;gap:7px}
.fab{height:46px;border:none;border-radius:999px;font-weight:900;box-shadow:0 8px 26px rgba(0,0,0,.55);cursor:pointer;font-family:inherit}
.fab.mid{flex:0 0 auto;padding:0 21px;background:#fff;color:#000;font-size:15px}
.fab.side{flex:1 1 0;min-width:0;padding:0 13px;background:#1c1c1e;color:#e8e8e8;border:1px solid #3a3a3c;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab.side.ph{visibility:hidden}
.rank-n{width:20px;text-align:center;font-size:14.5px;font-weight:900;color:#666;font-variant-numeric:tabular-nums}
.ccard{border-radius:18px;border:1px solid #1f1f1f;padding:15px;cursor:pointer;position:relative;overflow:hidden;background:#121212}
.ccard .nm{font-size:17px;font-weight:900;margin-top:10px}
.ccard .tg{font-size:12px;color:#8d8d8d;font-weight:600;margin-top:1px}
.ccard .cap{font-size:18px;font-weight:900;margin-top:10px;font-variant-numeric:tabular-nums}
.ccard .qq{font-size:11.5px;color:#999;font-weight:700;margin-top:2px}
.ccard .ck{font-size:10.5px;color:#8a8a8a;font-weight:700;margin-top:11px}
.ccard .cv{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:-.3px}
.ccard .cv2{font-size:14.5px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:1px}
.ccard .cs{font-size:10.5px;color:#767676;font-variant-numeric:tabular-nums}
.search{width:100%;background:#121212;border:1px solid #242424;border-radius:13px;padding:13px 15px;font-size:14.5px;color:#fff;outline:none;font-family:inherit}
.search::placeholder{color:#5f5f5f}
.sel{background:#141414;color:#ccc;border:1px solid #242424;border-radius:10px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(16px);background:#fff;color:#000;font-size:14px;font-weight:800;padding:11px 19px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none;white-space:nowrap;box-shadow:0 10px 34px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cmpbar{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:55;background:#fff;color:#000;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 34px rgba(0,0,0,.65);display:none;align-items:center;gap:7px}
.dsec{display:none;padding-top:4px}
.dsec.on{display:block;animation:fade .2s ease}
.flow-step{background:#121212;border:1px solid #222;border-radius:14px;padding:12px 14px}
.flow-step b{font-size:15px}
.flow-step p{font-size:12.5px;color:#8f8f8f;margin-top:2px}
.flow-ar{text-align:center;color:#555;font-size:16.5px;line-height:1.7}
.vthumb{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;cursor:pointer;border:1px solid #222}
.vthumb .vt{font-size:16.5px;font-weight:900;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.6);position:relative;z-index:2}
.vthumb .dur{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:6px;z-index:2}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;z-index:2}
.play:after{content:'';display:block;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #fff;margin-left:3px}
.shorts{display:flex;gap:10px;overflow-x:auto;padding:2px;scrollbar-width:none}
.shorts::-webkit-scrollbar{display:none}
.short-c{flex:0 0 110px;aspect-ratio:9/14;border-radius:14px;padding:11px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12.5px;font-weight:800;line-height:1.4;cursor:pointer;border:1px solid #262626;position:relative;overflow:hidden}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hs-item{flex:0 0 78%}
details{background:#121212;border:1px solid #1e1e1e;border-radius:14px;margin-bottom:8px;overflow:hidden}
details summary{padding:13px 15px;font-size:14.5px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary:after{content:'+';color:#666;font-weight:700}
details[open] summary:after{content:'−'}
details .dbody{padding:0 15px 14px;font-size:14px;color:#bbb;line-height:1.65}
.bg-note{background:rgba(255,255,255,.05);border:1px dashed #2e2e2e;border-radius:11px;padding:9px 12px;font-size:12.5px;color:#9c9c9c;line-height:1.6;margin-top:10px}
.bg-note b{color:#ccc}
#app.adv .bg-note{display:none}
.seg{display:flex;background:#131313;border:1px solid #222;border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg b{flex:1 0 auto;text-align:center;padding:8px 10px;border-radius:9px;font-size:12px;color:#888;cursor:pointer;font-weight:800;white-space:nowrap}
.seg b.on{background:#fff;color:#000}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.empty{text-align:center;padding:36px 16px;color:#777;font-size:14px;line-height:1.7}
.empty .e-ico{font-size:28px;margin-bottom:8px}
.slot{flex:1;aspect-ratio:1/1.05;border-radius:15px;border:1.5px dashed #2c2c2c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;color:#666;cursor:pointer;position:relative;background:#0d0d0d}
.slot.fl{border-style:solid;background:#141414}
.slot .rm{position:absolute;top:5px;right:7px;color:#777;font-size:12.5px;font-weight:700}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 2px}
.disc{background:#0d0d0d;border:1px solid #1c1c1c;border-radius:13px;padding:12px 14px;font-size:12px;color:#6e6e6e;line-height:1.7;margin:18px 0 8px}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 46% at 50% 104%,rgba(74,222,128,.30),rgba(74,222,128,.09) 48%,rgba(74,222,128,0) 76%),linear-gradient(180deg,#181b22 0%,#16191f 30%,#141821 48%,#121a1b 72%,#153827 100%);height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 26px 44px;text-align:center}
#splash>*{position:relative;z-index:1}
