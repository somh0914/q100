*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;line-height:1.45;overflow-anchor:none}
body{display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit}
#app{position:relative;width:100%;max-width:520px;min-height:100vh;background:#050505;overflow-x:hidden;box-shadow:0 0 90px rgba(0,0,0,.9)}
.scr{display:none;padding:16px 16px 110px;min-height:100vh}
.scr.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px;background:linear-gradient(#050505 78%,rgba(5,5,5,0))}

const lastG = c => (last(c.fin.rev)/c.fin.rev[c.fin.rev.length-2]-1)*100;
const lastOpm = c => last(c.fin.op)/last(c.fin.rev)*100;
const fcfM = c => last(c.fin.fcf)/last(c.fin.rev)*100;
const FX = DB.meta.fx;
function krw(vB, plain){
  if(!isFinite(vB) || vB===0) return '';
  const pre = plain? '' : '약 ';
  const jo = vB*FX/1000, s = jo<0?'-':'', a = Math.abs(jo);
  if(a>=100) return pre+s+Math.round(a).toLocaleString('ko-KR')+'조원';
  if(a>=1) return pre+s+(a>=10? a.toFixed(0) : a.toFixed(1))+'조원';
  return pre+s+Math.round(a*10000).toLocaleString('ko-KR')+'억원';
}
function krwS(str, plain){
  const m=/\$([\d.]+)\s*(T|B)/.exec(str||'');
  if(!m) return '';
  return krw(parseFloat(m[1])*(m[2]==='T'?1000:1), plain);
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1700); }
function toTop(){
  const z=()=>{
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
    const a=document.getElementById('top-anchor');
    if(a && a.scrollIntoView) a.scrollIntoView(true);
  };
  z();
  /* 외부 뷰어(웹뷰·iframe)가 스크롤을 쥔 경우: 문서 높이를 잠깐 화면 높이로 줄여
     바깥 스크롤을 강제로 0으로 클램프한 뒤 원상복구 */
  const app=document.getElementById('app');
  app.style.maxHeight='100vh'; app.style.overflow='hidden';
  requestAnimationFrame(z);
  setTimeout(()=>{ app.style.maxHeight=''; app.style.overflow=''; z(); }, 80);
  setTimeout(z, 250);
}

/* ---------- svg charts ---------- */
function svgBars(vals, labels, opt={}){
  const {color='#4ade80', fmt=v=>v, h=170, hi=true} = opt;
  const W=328, top=26, bot=20, n=vals.length;
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0);
  const rg=(mx-mn)||1, ph=h-top-bot;
  const y=v=> top+(mx-v)/rg*ph;
  const slot=W/n, bw=Math.min(46, slot*.52), zy=y(0);
  let s=`<svg viewBox="0 0 ${W} ${h}" style="width:100%;display:block">`;
  vals.forEach((v,i)=>{
    const x=slot*i+(slot-bw)/2, yy=Math.min(y(v),zy), hh=Math.max(Math.abs(y(v)-zy),2);
    const on=hi&&i===n-1;
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="5" fill="${on?color:'#2b2b2b'}"/>`;
    const ly=v>=0? yy-7 : yy+hh+11;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${on?'#fff':'#9a9a9a'}">${fmt(v)}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10.5" fill="#666">${labels[i]}</text>`;
  });
  if(mn<0) s+=`<line x1="0" x2="${W}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" stroke="#3a3a3a" stroke-width="1"/>`;
  return s+'</svg>';
}
function svgLine(vals, labels, opt={}){
  const {color='#4ade80', fmt=v=>v, h=140} = opt;
  const W=328, top=26, bot=20, n=vals.length;
  const mx=Math.max(...vals), mn=Math.min(...vals);
  const rg=(mx-mn)||1;
  const y=v=> top+(mx-v)/rg*(h-top-bot);
  const x=i=> 26+i*(W-52)/(n-1);
  let pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${h}" style="width:100%;display:block">`;
  s+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{
    s+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="#0a0a0a" stroke="${color}" stroke-width="2"/>`;
    s+=`<text x="${x(i).toFixed(1)}" y="${(y(v)-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#bbb">${fmt(v)}</text>`;
    s+=`<text x="${x(i).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10.5" fill="#666">${labels[i]}</text>`;
  });
  return s+'</svg>';
}
function donut(segs, base){
  const alphas=['','B3','66','3D','24'];
  const r=56, cx=80, cy=80, cir=2*Math.PI*r;
  let off=0, s=`<svg viewBox="0 0 160 160" style="width:150px;flex:0 0 auto">`;
  segs.forEach((sg,i)=>{
    const len=sg.p/100*cir, col=i<alphas.length? base+alphas[i] : '#333';
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${len.toFixed(1)} ${(cir-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len;
  });
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">매출 구성</text>`;
  s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10.5" fill="#888">FY 기준</text></svg>`;
  const leg = segs.map((sg,i)=>`<div class="row" style="gap:7px;margin:5px 0"><span class="dot" style="background:${i<alphas.length? base+alphas[i]:'#333'}"></span><span style="font-size:13px;color:#ccc;flex:1">${sg.n}</span><b style="font-size:13.5px">${sg.p}%</b></div>`).join('');
  return `<div class="row" style="gap:14px">${s}<div style="flex:1">${leg}</div></div>`;
}
const MOAT_L = ['브랜드','전환비용','네트워크','규모','데이터','기술력','생태계'];
function radar(vals, color){
  const cx=125, cy=100, R=64, n=7;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/n;
  const pt=(r,i)=> [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let s=`<svg viewBox="-16 0 282 200" style="width:100%;max-width:300px;display:block;margin:0 auto">`;
  [0.5,1].forEach(f=>{
    const p=Array.from({length:n},(_,i)=>pt(R*f,i).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${p}" fill="none" stroke="#242424" stroke-width="1"/>`;
  });
  for(let i=0;i<n;i++){ const [x2,y2]=pt(R,i);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1e1e1e" stroke-width="1"/>`; }
  const dp=Array.from({length:n},(_,i)=>pt(R*vals[i]/100,i).map(v=>v.toFixed(1)).join(',')).join(' ');
  s+=`<polygon points="${dp}" fill="${color}30" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  for(let i=0;i<n;i++){ const [x,y]=pt(R*vals[i]/100,i);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${color}"/>`; }
  for(let i=0;i<n;i++){
    const [x,y]=pt(R+15,i); const cs=Math.cos(ang(i));
    const anchor=Math.abs(cs)<.3?'middle':(cs>0?'start':'end');
    s+=`<text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#999">${MOAT_L[i]} ${vals[i]}</text>`;
  }
  return s+'</svg>';
}
function ring(v, color){
  const r=54, c=(2*Math.PI*r).toFixed(1);
  return `<svg viewBox="0 0 130 130" style="width:118px;flex:0 0 auto">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*r*v/100).toFixed(1)} ${c}" transform="rotate(-90 65 65)"/>
    <text x="65" y="63" text-anchor="middle" font-size="33" font-weight="900" fill="#fff">${v}</text>
    <text x="65" y="82" text-anchor="middle" font-size="11.5" fill="#888">/ 100 종합</text></svg>`;
}
function hRow(label, val, max, color, valText){
  return `<div class="row" style="margin:8px 0"><div class="metric-lbl">${label}</div>
    <div class="hbar"><i style="width:${Math.max(val/max*100,2).toFixed(1)}%;background:${color}"></i></div>
    <div class="metric-val">${valText!==undefined?valText:val}</div></div>`;
}

function matchQ(c, q){
  const hay=(c.name+' '+c.kr+' '+c.ticker+' '+c.tags.join(' ')+' '+c.traits.join(' ')+' '+c.oneLiner+' '+c.industry).toLowerCase();
  if(hay.includes(q)) return true;
  if(/현금/.test(q)) return fcfM(c)>=20 || c.traits.includes('고현금흐름');
  if(/수익|마진/.test(q)) return lastOpm(c)>=30;
  if(/성장/.test(q)) return lastG(c)>=12;
  if(/구독|반복/.test(q)) return c.traits.includes('높은 반복매출');
  if(/저평가|저밸류|싸/.test(q)) return c.traits.includes('저밸류');
  if(/해자|독점/.test(q)) return c.score.moat>=90;
  if(/ai|인공지능/.test(q)) return c.tags.includes('AI');
  return false;
}
function renderCGrid(){
  let arr=C.slice();
  if(st.ind!=='전체') arr=arr.filter(c=>c.tags.includes(st.ind));
  if(st.trait) arr=arr.filter(c=>c.traits.includes(st.trait));
  const q=st.q.trim().toLowerCase();
  if(q) arr=arr.filter(c=>matchQ(c,q));
  const s={qqq:(a,b)=>b.qqq-a.qqq, cap:(a,b)=>b.capB-a.capB, growth:(a,b)=>lastG(b)-lastG(a),
    score:(a,b)=>b.score.total-a.score.total, name:(a,b)=>a.name.localeCompare(b.name)};
  arr.sort(s[st.sort]);
  st.encList = arr.map(c=>c.id);
  $('#c-grid').innerHTML = arr.length? arr.map(ccard).join('')
    : `<div class="empty" style="grid-column:1/-1"><div class="e-ico">⌕</div>조건에 맞는 기업이 없습니다.<br>다른 검색어나 필터를 시도해 보세요.</div>`;
  $('#c-cnt').textContent = arr.length+'개 기업';
}

/* ---------- fav / compare ---------- */
function toggleFav(id){
  const c=byId[id];
  if(st.fav.has(id)){ st.fav.delete(id); toast(c.name+' 관심기업에서 제거'); }
  else { st.fav.add(id); toast('★ '+c.name+' 관심기업에 추가'); }
  if(st.cur===id) openCompany(id);
}
function toggleCmp(id){
  const c=byId[id];
  if(st.cmp.has(id)){ st.cmp.delete(id); toast(c.name+' 비교함에서 제거'); }
  else if(st.cmp.size>=4){ toast('비교는 최대 4개까지 가능합니다'); }
  else { st.cmp.add(id); toast(c.name+' 비교함에 추가 ('+st.cmp.size+'/4)'); }
  if(st.cur===id && $('#scr-company').classList.contains('active')) openCompany(id);
  if($('#scr-compare').classList.contains('active')) renderCompare();
  updateCmpBar();
}
function updateCmpBar(){
  const b=$('#cmpbar');
  const onCmp=$('#scr-compare').classList.contains('active');
  if(st.cmp.size>0 && !onCmp){ b.style.display='flex'; b.innerHTML='⇄ &nbsp;비교함 '+st.cmp.size+'개 열기'; }
  else b.style.display='none';
}
function openCompare(){ nav('compare'); }
function renderCompare(){
  const sel=[...st.cmp].map(id=>byId[id]);
  const slots=Array.from({length:4},(_,i)=>{
    const c=sel[i];
    if(c) return `<div class="slot fl"><span class="rm" onclick="toggleCmp('${c.id}')">✕</span>${avatar(c,36,12)}<b style="font-size:12.5px">${c.ticker}</b></div>`;
    return `<div class="slot" onclick="toast('아래 목록에서 기업을 추가하세요')">+<span>기업 추가</span></div>`;
  }).join('');
  const rest=C.filter(c=>!st.cmp.has(c.id));
  const metrics=[
    {k:'매출 (FY25)', get:c=>last(c.fin.rev), fmt:fB},
    {k:'매출 성장률', get:lastG, fmt:v=>fPct(v)},
    {k:'영업이익률', get:lastOpm, fmt:v=>mPct(v)},
    {k:'FCF 마진', get:fcfM, fmt:v=>mPct(v,0)},
    {k:'PER', get:c=>c.val.per, fmt:v=>v+'x'},
    {k:'시가총액', get:c=>c.capB, fmt:fB},
    {k:'Q100 종합', get:c=>c.score.total, fmt:v=>v+'점'}
  ];
  $('#scr-compare').innerHTML=`
  <div class="hdr"><div class="row" style="gap:10px">
    <button class="icon-btn" onclick="back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b style="font-size:19px">기업 비교 <span class="tiny">최대 4개</span></b></div>
    ${st.cmp.size?`<span class="chip" onclick="st.cmp.clear();renderCompare();updateCmpBar()">전체 비우기</span>`:''}</div>
  <div class="row" style="gap:8px">${slots}</div>
  ${rest.length?`<div class="chiprow" style="margin-top:12px">${rest.map(c=>`<span class="chip" onclick="toggleCmp('${c.id}')"><span class="dot" style="background:${c.color}"></span>${krName(c)} <span style="color:#888">${c.name}</span></span>`).join('')}</div>`:''}
  ${sel.length<2? `<div class="empty"><div class="e-ico">⇄</div>2개 이상 선택하면 비교 그래프가 나타납니다.<br>예: NVIDIA vs AMD vs Broadcom</div>`
  : metrics.map(m=>{
      const vals=sel.map(m.get); const mx=Math.max(...vals.map(Math.abs));
      return `<div class="sec-t">${m.k}</div><div class="card" style="padding:12px 16px">
        ${sel.map((c,i)=>`<div class="row" style="margin:8px 0">
          <div class="metric-lbl" style="width:84px;font-weight:800;color:#ddd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${krName(c)}</div>
          <div class="hbar"><i style="width:${Math.max(Math.abs(vals[i])/mx*100,2).toFixed(1)}%;background:${c.color}"></i></div>
          <div class="metric-val" style="width:74px">${m.fmt(vals[i])}</div></div>`).join('')}</div>`;
    }).join('')}
  ${sel.length>=2?`<div class="disc">${DB.meta.note}</div>`:''}
  <button class="backfab" onclick="back()">‹ 뒤로</button>`;
  updateCmpBar();
}
