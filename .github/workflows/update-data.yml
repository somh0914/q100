name: 데이터 자동 업데이트

on:
  schedule:
    # 매주 화~토 한국시간 아침 7:35 (미국 장 마감 후) 자동 실행
    - cron: '35 22 * * 1-5'
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 최신 시세 수집 및 live.json 생성
        run: python scripts/update_data.py

      - name: 변경사항 저장 (커밋)
        run: |
          git config user.name "q100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "📈 데이터 자동 업데이트 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
