name: 데이터 자동 업데이트

on:
  schedule:
    # 한국시간 아침 07:05 / 07:35 — 미국 장 마감 후 첫 수집. GitHub가 예약 실행을 자주
    # 건너뛰거나 미루기 때문에 두 개로 나눠 걸어 아침 8시 전에 최소 한 번은 돌게 한다.
    - cron: '5 22 * * 1-5'
    - cron: '35 22 * * 1-5'
    # 백업 — 같은 날 09:35 (위 둘이 모두 누락됐을 때)
    - cron: '35 0 * * 2-6'
    # 2차 백업 — 낮 12:35 (보조 소스 지연까지 감안한 최종 안전망)
    - cron: '35 3 * * 2-6'
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 최신 시세 수집 및 live.json 생성
        run: python scripts/update_data.py

      - name: 변경사항 저장 (커밋)
        run: |
          git config user.name "q100-bot"
          git config user.email "actions@users.noreply.github.com"
          cp live.json /tmp/new_live.json
          upd() { python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('updated',''))" "$1"; }
          # 실행이 겹쳐도 안전하게: 저장 직전에 저장소 최신 상태를 다시 받아
          #  - 다른 실행이 이미 같은 날짜(또는 더 최신) 종가를 저장했다면 → 그대로 두고 성공 종료 (실패 메일 없음)
          #  - 내 데이터가 더 최신이면 → 최신 저장소 위에 내 live.json만 얹어서 저장 (최대 3번 시도)
          for i in 1 2 3; do
            git fetch -q origin main
            git show origin/main:live.json > /tmp/remote_live.json 2>/dev/null || echo '{}' > /tmp/remote_live.json
            NEW=$(upd /tmp/new_live.json); OLD=$(upd /tmp/remote_live.json)
            if [ -n "$OLD" ] && [[ ! "$NEW" > "$OLD" ]]; then
              echo "저장소에 이미 $OLD 종가가 있음 → 이번 결과($NEW)는 저장하지 않고 성공 종료"; exit 0
            fi
            git reset -q --hard origin/main
            cp /tmp/new_live.json live.json
            git add live.json
            git diff --cached --quiet && { echo "변경 없음"; exit 0; }
            git commit -q -m "📈 데이터 자동 업데이트 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
