name: 데이터 자동 업데이트

on:
  schedule:
    # 한국시간 아침 07:05 / 07:35 — 미국 장 마감 후 첫 수집. GitHub가 예약 실행을 자주
    # 건너뛰거나 미루기 때문에 두 개로 나눠 걸어 아침 8시 전에 최소 한 번은 돌게 한다.
    - cron: '5 22 * * 1-5'
    - cron: '35 22 * * 1-5'
    # 백업 — 같은 날 09:35 (위 둘이 모두 누락됐을 때)
    - cron: '35 0 * * 2-6'
    # 2차 백업 — 낮 12:35 (보조 소스 지연까지 감안한 최종 안전망)
    - cron: '35 3 * * 2-6'
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 최신 시세 수집 및 live.json 생성
        run: python scripts/update_data.py

      - name: 변경사항 저장 (커밋)
        run: |
          git config user.name "q100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "📈 데이터 자동 업데이트 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
